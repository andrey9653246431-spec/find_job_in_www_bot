name: Run Telegram Bot (GitHub Actions Free Runner)

on:
  workflow_dispatch:
    inputs:
      run_duration_minutes:
        description: "Сколько минут держать бота запущенным в этой сессии (макс. 350 мин для одного рана)"
        required: false
        default: "60"
        type: string
  # Опционально: автоперезапуск по расписанию каждые 6 часов (раскомментируйте при необходимости)
  # schedule:
  #   - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore SQLite database from cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bot-sqlite-db-${{ github.run_id }}
          restore-keys: |
            bot-sqlite-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot with GitHub Secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'llama-3.3-70b-versatile' }}
          DB_PATH: data/bot_database.sqlite3
          HTTP_TIMEOUT: "15"
          MAX_VACANCIES_PER_MESSAGE: "10"
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ Ошибка: Секрет BOT_TOKEN не задан в Settings -> Secrets and variables -> Actions!"
            exit 1
          fi
          DURATION_MIN="${{ inputs.run_duration_minutes || '60' }}"
          DURATION_SEC=$(( DURATION_MIN * 60 ))
          echo "🤖 Запуск бота на ${DURATION_MIN} мин. (${DURATION_SEC} сек.)..."
          timeout --preserve-status "${DURATION_SEC}s" python main.py || true

      - name: Save SQLite database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bot-sqlite-db-${{ github.run_id }}
