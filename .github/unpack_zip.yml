name: Unpack ZIP Archive to Repository

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "find_job_in_www_bot.zip"
      - "*.zip"
      - ".github/workflows/unpack_zip.yml"
  workflow_dispatch:
    inputs:
      zip_filename:
        description: "Имя ZIP-архива в корне репозитория"
        required: false
        default: "find_job_in_www_bot.zip"
        type: string
      remove_zip:
        description: "Удалить ZIP-архив после распаковки"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  unpack-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack ZIP archive into repository root
        shell: bash
        run: |
          set -e
          ZIP_FILE="${{ inputs.zip_filename || 'find_job_in_www_bot.zip' }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ℹ️ Архив $ZIP_FILE не найден в корне репозитория (возможно, уже распакован)."
            exit 0
          fi

          echo "📦 Распаковываю $ZIP_FILE в корень репозитория..."
          python3 -m zipfile -e "$ZIP_FILE" .

          REMOVE_ZIP="${{ inputs.remove_zip || 'true' }}"
          if [ "$REMOVE_ZIP" = "true" ]; then
            rm -f "$ZIP_FILE"
            echo "🧹 Архив $ZIP_FILE удалён после успешной распаковки."
          fi

      - name: Verify project tests (pytest)
        run: |
          if [ -f "requirements.txt" ]; then
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt
            pytest -v
          fi

      - name: Commit and push unpacked files to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Нет новых файлов для коммита."
          else
            git commit -m "feat(actions): auto-unpack $ZIP_FILE into repository"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "🚀 Все файлы из архива распакованы и сохранены в ветку ${GITHUB_REF_NAME}!"
          fi
