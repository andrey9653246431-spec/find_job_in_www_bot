name: Run Telegram Bot (GitHub Actions Free Runner)

# ── Почему бот раньше работал «не постоянно» и что здесь исправлено ──────────────
# 1. Расписание было закомментировано: бот запускался ТОЛЬКО вручную кнопкой
#    «Run workflow», поэтому между запусками он просто не работал.
# 2. Один job в GitHub Actions не может идти дольше 6 часов (360 мин). Сессия
#    по умолчанию 120 мин: короткие сессии перезапускаются часто (простой ~1 мин,
#    апдейты Telegram за это время не теряются — они ждут на сервере 24 ч),
#    а новый код подхватывается без долгого ожидания.
# 3. Прерванную сессию больше никто не поднимал. Теперь в конце каждого успешного
#    запуска workflow сам запускает следующую сессию (self re-dispatch), плюс
#    расписание каждые 6 часов как страховка.
# 4. В публичном репозитории GitHub отключает запланированные workflow после
#    60 дней БЕЗ АКТИВНОСТИ в репозитории (вход в GitHub тут ни при чём).
#    Поэтому каждый запуск раз в сутки делает heartbeat-коммит — активность
#    всегда свежая, снижаем риск отключения расписания (push требует разрешений).
# 5. Сам бот теперь перезапускает polling после ошибок (main.py) — сетевой сбой
#    или 409 Conflict больше не убивают сессию.

on:
  workflow_dispatch:
    inputs:
      run_duration_minutes:
        description: "Сколько минут держать бота в этой сессии (макс. 350, по умолчанию 120)"
        required: false
        default: "120"
        type: string
  # Страховка: если цепочка перезапусков когда-нибудь оборвётся — GitHub поднимет бота сам
  schedule:
    - cron: "0 */6 * * *"
  # Перезапуск с новым кодом при правках через веб-интерфейс GitHub
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "main.py"
