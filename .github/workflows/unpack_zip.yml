name: Unpack ZIP Archive & Run Tests (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

# Сериализуем запуски: два одновременных прогона не будут «перегонять» друг друга
concurrency:
  group: unpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack ZIP archive into repository root (if present)
        shell: bash
        run: |
          set -e
          ZIP_FILE="find_job_in_www_bot.zip"

          # Браузеры добавляют к имени метку времени («find_job_in_www_bot 15.42.38.zip»),
          # поэтому если точного имени нет — берём самый свежий архив по маске.
          if [ ! -f "$ZIP_FILE" ]; then
            CANDIDATE="$(ls -t find_job_in_www_bot*.zip 2>/dev/null | head -n 1 || true)"
            if [ -n "$CANDIDATE" ]; then
              ZIP_FILE="$CANDIDATE"
              echo "🔎 Точного имени нет, но найден архив: $ZIP_FILE"
            fi
          fi

          if [ -f "$ZIP_FILE" ]; then
            echo "📦 Размер архива: $(wc -c < "$ZIP_FILE") байт — распаковываю в корень репозитория..."
            python3 -m zipfile -e "$ZIP_FILE" .

            # Если архив собран «папкой» (внутри есть main.py + bot/), поднимаем содержимое в корень
            for candidate in */; do
              if [ -f "${candidate}main.py" ] && [ -d "${candidate}bot" ]; then
                echo "📁 Архив с вложенной папкой (${candidate}) — переношу содержимое в корень"
                cp -af "${candidate}." .
                rm -rf "$candidate"
              fi
            done

            rm -f find_job_in_www_bot*.zip
            echo "🧹 Архивы удалены после распаковки."
          else
            echo "ℹ️ Архив отсутствует — работаю с уже распакованными файлами."
          fi

          # Контроль результата: без этих файлов репозиторий нерабочий
          for required in main.py bot/database.py bot/services/vacancy_parser.py; do
            if [ ! -f "$required" ]; then
              echo "::error::После распаковки отсутствует $required"
              exit 1
            fi
          done
          echo "✅ Ключевые файлы на месте: main.py, bot/database.py, bot/services/vacancy_parser.py"
          grep -c "remoteok.com\|fuck_the_frameworks" bot/database.py || true

          # Убираем служебные артефакты предыдущих версий
          rm -rf .github/workflow .github/unpack_and_setup.py
          rm -f run_bot.yml unpack.yml          # дубликаты workflow-файлов в корне репозитория
          rm -f .github/workflows/ci.yml

      - name: Set up Python 3.12 and run tests (pytest)
        run: |
          if [ -f "requirements.txt" ]; then
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt
            pytest -v
          fi

      - name: Commit and push unpacked files to main branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"

          stage_changes() {
            git add -A
            # Исключаем .github/workflows/: у GITHUB_TOKEN нет на это права (workflows scope)
            git reset -q HEAD .github/workflows/ || true
            git checkout -- .github/workflows/ 2>/dev/null || true
          }

          stage_changes

          if git diff --cached --quiet; then
            echo "ℹ️ Изменений нет: репозиторий уже содержит актуальные файлы. Push не требуется."
            exit 0
          fi

          git commit -m "feat(actions): auto-unpack project files into repository"

          for attempt in 1 2 3; do
            echo "🔁 Попытка push #${attempt} в ветку ${BRANCH}..."
            if git push origin "HEAD:${BRANCH}"; then
              echo "🚀 Файлы успешно распакованы и сохранены в ветку ${BRANCH}!"
              exit 0
            fi

            echo "⚠️ Push отклонён (ветка ушла вперёд — параллельный прогон). Синхронизируюсь..."
            git fetch origin "${BRANCH}"
            git reset --mixed "origin/${BRANCH}"   # рабочее дерево сохраняется
            stage_changes

            if git diff --cached --quiet; then
              echo "✅ Содержимое ветки уже идентично архиву — досылать нечего."
              exit 0
            fi

            git commit -m "feat(actions): auto-unpack project files into repository (retry ${attempt})"
            sleep $((attempt * 3))
          done

          echo "::error::Не удалось запушить изменения после 3 попыток."
          git status
          git log --oneline -5
          exit 1
